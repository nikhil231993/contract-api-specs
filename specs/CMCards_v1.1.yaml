openapi: 3.0.3
info:
  title: Cards API
  version: 1.1.0
  description: |
    Retrieve, block, unblock and set limits on cards.
    Changes from v1.0:
      - POST /cards/{cardId}/block now requires a request body with a reason (breaking).
      - New POST /cards/{cardId}/unblock.
      - New PUT /cards/{cardId}/limits.
servers:
  - url: https://api.example-bank.com/cards/v1
security:
  - bearerAuth: []
tags:
  - name: Cards
  - name: Limits
paths:
  /cards/{cardId}:
    get:
      tags: [Cards]
      operationId: getCard
      summary: Get card details (PAN masked)
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Card found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '404':
          $ref: '#/components/responses/NotFound'
  /cards/{cardId}/block:
    post:
      tags: [Cards]
      operationId: blockCard
      summary: Block a card with a reason
      parameters:
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockRequest'
      responses:
        '200':
          description: Card blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /cards/{cardId}/unblock:
    post:
      tags: [Cards]
      operationId: unblockCard
      summary: Unblock a temporarily blocked card
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Card unblocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Card was permanently blocked (LOST/STOLEN) and cannot be unblocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cards/{cardId}/limits:
    put:
      tags: [Limits]
      operationId: setCardLimits
      summary: Replace the spending limits on a card
      parameters:
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardLimits'
      responses:
        '200':
          description: Limits updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardLimits'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Card:
      type: object
      required: [cardId, maskedPan, status, cardType]
      properties:
        cardId:
          type: string
        maskedPan:
          type: string
          pattern: '^[0-9]{4} \*{4} \*{4} [0-9]{4}$'
          example: '4111 **** **** 1111'
        cardType:
          type: string
          enum: [DEBIT, CREDIT]
        status:
          type: string
          enum: [ACTIVE, TEMPORARILY_BLOCKED, BLOCKED, EXPIRED]
        blockReason:
          type: string
          enum: [LOST, STOLEN, SUSPECTED_FRAUD, TEMPORARY]
          nullable: true
        expiry:
          type: string
          pattern: '^(0[1-9]|1[0-2])/[0-9]{2}$'
    BlockRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [LOST, STOLEN, SUSPECTED_FRAUD, TEMPORARY]
        note:
          type: string
          maxLength: 200
    CardLimits:
      type: object
      required: [dailyPurchaseLimit, dailyAtmLimit]
      properties:
        dailyPurchaseLimit:
          type: integer
          minimum: 0
          maximum: 50000
        dailyAtmLimit:
          type: integer
          minimum: 0
          maximum: 5000
        contactlessEnabled:
          type: boolean
          default: true
        onlineEnabled:
          type: boolean
          default: true
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
