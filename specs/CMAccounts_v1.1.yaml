openapi: 3.0.3
info:
  title: Accounts API
  version: 1.1.0
  description: |
    Retrieve and open customer bank accounts.
    Breaking changes from v1.0:
      - GET /accounts is now paginated and returns an AccountPage envelope.
      - Balance.balance (number) replaced by currentBalance/availableBalance Money objects.
    New in v1.1:
      - POST /accounts to open an account.
servers:
  - url: https://api.example-bank.com/accounts/v1
security:
  - bearerAuth: []
tags:
  - name: Accounts
paths:
  /accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List accounts for the authenticated customer (paginated)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AccountStatus'
      responses:
        '200':
          description: Accounts found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Accounts]
      operationId: openAccount
      summary: Open a new account
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAccountRequest'
      responses:
        '201':
          description: Account opened
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /accounts/{accountId}:
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get a single account by id
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Account found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /accounts/{accountId}/balance:
    get:
      tags: [Accounts]
      operationId: getAccountBalance
      summary: Get current and available balance of an account
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Balance found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        pattern: '^ACC[0-9]{8}$'
      example: ACC12345678
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AccountStatus:
      type: string
      enum: [OPEN, CLOSED, FROZEN]
    Account:
      type: object
      required: [accountId, accountType, status, currency, openedAt]
      properties:
        accountId:
          type: string
          example: ACC12345678
        accountType:
          type: string
          enum: [SAVINGS, TRANSACTION, CREDIT, TERM_DEPOSIT]
        nickname:
          type: string
          maxLength: 40
        status:
          $ref: '#/components/schemas/AccountStatus'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: AUD
        openedAt:
          type: string
          format: date-time
    AccountPage:
      type: object
      required: [data, page, pageSize, totalRecords]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        page:
          type: integer
        pageSize:
          type: integer
        totalRecords:
          type: integer
    OpenAccountRequest:
      type: object
      required: [accountType, currency]
      properties:
        accountType:
          type: string
          enum: [SAVINGS, TRANSACTION, TERM_DEPOSIT]
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        nickname:
          type: string
          maxLength: 40
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^-?[0-9]+\.[0-9]{2}$'
          example: '1520.75'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: AUD
    Balance:
      type: object
      required: [accountId, currentBalance, availableBalance, asOf]
      properties:
        accountId:
          type: string
        currentBalance:
          $ref: '#/components/schemas/Money'
        availableBalance:
          $ref: '#/components/schemas/Money'
        asOf:
          type: string
          format: date-time
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string
